version: 2

models:
  - name: dim_artist
    columns:
      - name: artist_id
        tests:
          - not_null
          - unique

  - name: dim_album
    columns:
      - name: album_id
        tests:
          - not_null
          - unique

  - name: dim_track
    columns:
      - name: track_id
        tests:
          - not_null
          - unique

  - name: dim_time
    columns:
      - name: ts
        tests:
          - not_null
          - unique

  - name: fact_listening
    columns:
      - name: played_at_ts
        tests:
          - not_null
      - name: track_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_track')
              field: track_id
      - name: album_id
        tests:
          - relationships:
              to: ref('dim_album')
              field: album_id
      - name: artist_id
        tests:
          - relationships:
              to: ref('dim_artist')
              field: artist_id
