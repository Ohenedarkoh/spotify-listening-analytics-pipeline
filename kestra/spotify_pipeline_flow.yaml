id: spotify_pipeline
namespace: default

triggers:
  - id: daily
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 6 * * *"

tasks:
  - id: wdir
    type: io.kestra.plugin.core.flow.WorkingDirectory
    tasks:
      - id: clone_repo
        type: io.kestra.plugin.git.Clone
        url: "{{ secret('GIT_REPO_URL') }}"
        branch: "main"

      - id: extract
        type: io.kestra.plugin.scripts.shell.Commands
        containerImage: python:3.11
        inputFiles:
          gcp_key.json: "{{ secret('GCP_SA_KEY_JSON') }}"
        beforeCommands:
          - "pip install -r requirements.txt"
          - "mkdir -p state"
          - "test -f state/watermark.json || echo '{\"last_played_at_ms\":0}' > state/watermark.json"
        commands:
          - "python ingestion/extract_spotify_data.py"
        env:
          SPOTIFY_CLIENT_ID: "{{ secret('SPOTIFY_CLIENT_ID') }}"
          SPOTIFY_CLIENT_SECRET: "{{ secret('SPOTIFY_CLIENT_SECRET') }}"
          SPOTIFY_REFRESH_TOKEN: "{{ secret('SPOTIFY_REFRESH_TOKEN') }}"
          SPOTIFY_REDIRECT_URI: "{{ secret('SPOTIFY_REDIRECT_URI') }}"
          GOOGLE_APPLICATION_CREDENTIALS: "gcp_key.json"

      - id: upload_gcs
        type: io.kestra.plugin.scripts.shell.Commands
        containerImage: python:3.11
        inputFiles:
          gcp_key.json: "{{ secret('GCP_SA_KEY_JSON') }}"
        beforeCommands:
          - "pip install -r requirements.txt"
        commands:
          - "python ingestion/upload_to_gcs.py"
        env:
          GOOGLE_APPLICATION_CREDENTIALS: "gcp_key.json"

      - id: load_bq
        type: io.kestra.plugin.scripts.shell.Commands
        containerImage: python:3.11
        inputFiles:
          gcp_key.json: "{{ secret('GCP_SA_KEY_JSON') }}"
        beforeCommands:
          - "pip install -r requirements.txt"
        commands:
          - "python ingestion/load_to_bigquery.py"
        env:
          GOOGLE_APPLICATION_CREDENTIALS: "gcp_key.json"

      - id: dbt_run
        type: io.kestra.plugin.scripts.shell.Commands
        containerImage: ghcr.io/dbt-labs/dbt-bigquery:1.11.latest
        inputFiles:
          gcp_key.json: "{{ secret('GCP_SA_KEY_JSON') }}"
        commands:
          - "printf 'spotify_analytics:\\n  target: dev\\n  outputs:\\n    dev:\\n      type: bigquery\\n      method: service-account\\n      project: new-project-19180\\n      dataset: spotify_analytics\\n      keyfile: gcp_key.json\\n      threads: 2\\n      timeout_seconds: 300\\n      location: US\\n' > /tmp/profiles.yml"
          - "dbt run --project-dir dbt/spotify_analytics --profiles-dir /tmp"
          - "dbt test --project-dir dbt/spotify_analytics --profiles-dir /tmp"
        env:
          GOOGLE_APPLICATION_CREDENTIALS: "gcp_key.json"
        retry:
          type: constant
          interval: PT2M
          maxAttempt: 3
